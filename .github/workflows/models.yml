name: Model tests

# These tests load the real speaker model and voice detector, which means downloading their weights.
# They run once a week and on demand, not on every pull request.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker compose build backend
      - name: Test the real models
        run: docker compose run --rm --no-deps -e RUN_MODEL_TESTS=1 backend pytest tests/test_real_models.py
